<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Preview</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Image Preview</h1>
    <div id="image" class="preview-area" role="status" aria-live="polite">
      Hover over an image below to display here.
    </div>

    <div class="gallery" aria-label="Image gallery">
      <img class="preview" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="A mountain range beneath a bright sky" loading="lazy">
      <img class="preview" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="Turquoise ocean waves meeting a sandy beach" loading="lazy">
      <img class="preview" src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="A sunlit green forest path" loading="lazy">
    </div>
    <p class="attribution">Photos from <a href="https://unsplash.com" target="_blank" rel="noreferrer">Unsplash</a></p>
  </main>
</body>
</html>
